<text x="472" y="144" font-size="11.5" fill="#5EEAD4" font-weight="700" text-anchor="start" class="mono" letter-spacing="0.8">02 · TAP TO FORK (04.92)</text>
<text x="472" y="174" font-size="21" fill="#F3F8F2" font-weight="700" text-anchor="start" >Tap Body · Vibration Fork</text>
<text x="472" y="204" font-size="13.5" fill="#9BB8A8" font-weight="400" text-anchor="start" >Changed your mind mid-thought? Tap the</text>
<text x="472" y="224" font-size="13.5" fill="#9BB8A8" font-weight="400" text-anchor="start" >D3200 until vibration to spawn a clean chat.</text>
<line x1="472" y1="244" x2="808" y2="244" stroke="#1C382F"/>
<circle cx="478" cy="270" r="3.2" fill="#5EEAD4"/>
<text x="492" y="274" font-size="13.5" fill="#F3F8F2" font-weight="500" text-anchor="start" >Firmware 04.92 flags=01 marker</text>
<circle cx="478" cy="302" r="3.2" fill="#5EEAD4"/>
<text x="492" y="306" font-size="13.5" fill="#F3F8F2" font-weight="500" text-anchor="start" >HUD confirms tap-to-fork live</text>
<circle cx="478" cy="334" r="3.2" fill="#5EEAD4"/>
<text x="492" y="338" font-size="13.5" fill="#F3F8F2" font-weight="500" text-anchor="start" >Idempotent—extra taps never duplicate</text>
<rect x="852" y="106" width="384" height="278" rx="18" fill="#11231E" stroke="#25493D" stroke-width="1.3" filter="url(#cardShadow)"/>
