<text x="44" y="52" font-size="26" fill="#F3F8F2" font-weight="700" text-anchor="start" letter-spacing="-0.5">Zero-Keyboard Tactile Interaction</text>
<text x="44" y="80" font-size="15" fill="#9BB8A8" font-weight="400" text-anchor="start" >Target freezes on first press. Tap mid-speech to fork a clean chat. Ambiguity always fails closed.</text>
