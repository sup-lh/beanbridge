<text x="68" y="144" font-size="11.5" fill="#C6F38A" font-weight="700" text-anchor="start" class="mono" letter-spacing="0.8">01 · PRESS TO LOCK</text>
<text x="68" y="174" font-size="21" fill="#F3F8F2" font-weight="700" text-anchor="start" >Short Press · Freeze Target</text>
<text x="68" y="204" font-size="13.5" fill="#9BB8A8" font-weight="400" text-anchor="start" >Captures your single foreground thread</text>
<text x="68" y="224" font-size="13.5" fill="#9BB8A8" font-weight="400" text-anchor="start" >on first press—tab switches never drift.</text>
<line x1="68" y1="244" x2="404" y2="244" stroke="#1C382F"/>
<circle cx="74" cy="270" r="3.2" fill="#C6F38A"/>
<text x="88" y="274" font-size="13.5" fill="#F3F8F2" font-weight="500" text-anchor="start" >Codex dual-copy UUID verification</text>
<circle cx="74" cy="302" r="3.2" fill="#C6F38A"/>
<text x="88" y="306" font-size="13.5" fill="#F3F8F2" font-weight="500" text-anchor="start" >Doubao 25-char empty hint filter</text>
<circle cx="74" cy="334" r="3.2" fill="#C6F38A"/>
<text x="88" y="338" font-size="13.5" fill="#F3F8F2" font-weight="500" text-anchor="start" >Paseo daemon unique tab matching</text>
<rect x="448" y="106" width="384" height="278" rx="18" fill="#11231E" stroke="#25493D" stroke-width="1.3" filter="url(#cardShadow)"/>
