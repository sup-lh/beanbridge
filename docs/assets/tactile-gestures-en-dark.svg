<path d="M1190 149L1193 152L1199 145" fill="none" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="876" y="144" font-size="11.5" fill="#FBBF24" font-weight="700" text-anchor="start" class="mono" letter-spacing="0.8">03 · FAIL-CLOSED GUARD</text>
<text x="876" y="174" font-size="21" fill="#F3F8F2" font-weight="700" text-anchor="start" >Ambiguity · Zero Misfire</text>
<text x="876" y="204" font-size="13.5" fill="#9BB8A8" font-weight="400" text-anchor="start" >Split panes, duplicate titles, or lost focus</text>
<text x="876" y="224" font-size="13.5" fill="#9BB8A8" font-weight="400" text-anchor="start" >never guess—text locks safely in Pending.</text>
<line x1="876" y1="244" x2="1212" y2="244" stroke="#1C382F"/>
<circle cx="882" cy="270" r="3.2" fill="#FBBF24"/>
<text x="896" y="274" font-size="13.5" fill="#F3F8F2" font-weight="500" text-anchor="start" >0o600 disk permissions &amp; receipts</text>
<circle cx="882" cy="302" r="3.2" fill="#FBBF24"/>
<text x="896" y="306" font-size="13.5" fill="#F3F8F2" font-weight="500" text-anchor="start" >One-click mid-recording Cancel</text>
<circle cx="882" cy="334" r="3.2" fill="#FBBF24"/>
<text x="896" y="338" font-size="13.5" fill="#F3F8F2" font-weight="500" text-anchor="start" >Recover or spawn clean chat anytime</text>
