<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="416" viewBox="0 0 1280 416" role="img" aria-label="Three Tactile Hardware Guarantees">
<title>Three Tactile Hardware Guarantees</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Helvetica,Arial,sans-serif} .mono{font-family:"SF Mono",Menlo,Monaco,Consolas,"Liberation Mono",monospace} </style>
<rect x="0.75" y="0.75" width="1278.5" height="414.5" rx="24" fill="#0B1613" stroke="#1E3B31" stroke-width="1.5"/>
