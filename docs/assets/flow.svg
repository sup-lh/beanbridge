<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410" role="img" aria-label="Implemented audio-to-message data flow">
<title>Implemented audio-to-message data flow</title>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif} .mono{font-family:Menlo,Consolas,monospace}</style>
<rect width="1280" height="410" rx="24" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#2563EB"/></marker></defs>
<text x="40" y="51" font-size="28" fill="#111827" font-weight="600" text-anchor="start" >From a press to a message</text>
<text x="40" y="83" font-size="16" fill="#6B7280" font-weight="400" text-anchor="start" >Audio is decoded and transcribed on your Mac. Final text goes to the selected Codex thread.</text>
<rect x="339" y="116" width="602" height="194" rx="12" fill="#F8FAFC" stroke="#D1D5DB" stroke-dasharray="6 5"/>
<text x="359" y="139" font-size="11" fill="#6B7280" font-weight="600" text-anchor="start" letter-spacing="2">ON YOUR MAC</text>
