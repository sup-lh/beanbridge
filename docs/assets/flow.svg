<text x="320.0" y="215" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle" >BLE</text>
<path d="M608 229L672 229" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
<text x="640.0" y="215" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle" >PCM</text>
<path d="M928 229L992 229" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
<text x="960.0" y="215" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle" >final text</text>
