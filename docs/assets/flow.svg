<text x="382" y="270" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start" >Encrypted Opus to audio</text>
<rect x="680" y="155" width="240" height="136" rx="8" fill="#F0FDF4" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="895" y="181" font-size="12" fill="#6B7280" font-weight="500" text-anchor="end" class="mono">03</text>
<rect x="702" y="181" width="35" height="4" rx="2" fill="#16A34A"/>
<rect x="702" y="193" width="44" height="4" rx="2" fill="#16A34A"/>
<rect x="702" y="205" width="27" height="4" rx="2" fill="#16A34A"/>
<text x="702" y="244" font-size="23" fill="#111827" font-weight="600" text-anchor="start" >Local ASR</text>
<text x="702" y="270" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start" >Whisper + live preview</text>
<rect x="1000" y="155" width="240" height="136" rx="8" fill="#FAF5FF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="1215" y="181" font-size="12" fill="#6B7280" font-weight="500" text-anchor="end" class="mono">04</text>
<rect x="1020" y="176" width="49" height="37" rx="6" fill="#111827"/>
<path d="M1031 186L1040 194L1031 202M1044 202H1056" fill="none" stroke="#D8B4FE" stroke-width="2.6" stroke-linecap="round"/>
<text x="1022" y="244" font-size="23" fill="#111827" font-weight="600" text-anchor="start" >Codex queue</text>
<text x="1022" y="270" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start" >Explicit thread ID</text>
<line x1="40" y1="338" x2="1240" y2="338" stroke="#E5E7EB"/>
<text x="40" y="372" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start" >The recorder retains its own audio.</text>
<text x="1240" y="372" font-size="14" fill="#6B7280" font-weight="400" text-anchor="end" >Queued does not always mean processing immediately.</text>
