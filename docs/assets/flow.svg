<path d="M75 181V203" stroke="white" stroke-width="3" stroke-linecap="round"/>
<text x="62" y="244" font-size="23" fill="#111827" font-weight="600" text-anchor="start" >D3200</text>
<text x="62" y="270" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start" >Press to start / stop</text>
<rect x="360" y="155" width="240" height="136" rx="8" fill="#F0FDFA" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="575" y="181" font-size="12" fill="#6B7280" font-weight="500" text-anchor="end" class="mono">02</text>
