<text x="640" y="524" font-size="13" fill="#F6FAF0" font-weight="600" text-anchor="middle" >Creation/ &amp; Submissions/ receipts enforce idempotent claiming (0o600): timeouts enter &#x27;uncertain&#x27; instead of double-sending.</text>
